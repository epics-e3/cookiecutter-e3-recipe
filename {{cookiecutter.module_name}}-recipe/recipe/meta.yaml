# Note: there are many handy hints in comments in this example -- remove them when you've finalized your recipe
# The final recipe shouldn't contain any comments!
{{ "{%" }} set version = "{{ cookiecutter.module_version }}" {{ "%}" }}
{{ "{%" }} set name = "{{ cookiecutter.module_name | lower }}" {{ "%}" }}

package:
{%- raw %}
  name: "{{ name }}"
  version: "{{ version }}"
{%- endraw %}

source:
  - git_url: {{ cookiecutter.module_url }}.git
{%- raw %}
    git_rev: {{ version }}
{%- endraw %}
  # Extra source files (Makefile, iocsh) should be copied under the ../src directory
  - path: ../src

build:
  number: 0
  run_exports:
{%- raw %}
    - {{ pin_subpackage('{{ name }}', max_pin='x.x.x.x') }}
{%- endraw %}

requirements:
  build:
{%- raw %}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
{%- endraw %}
  host:
    - epics-base
    - require

test:
{%- raw %}
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r {{ name }}
{%- endraw %}

about:
  home: "{{ cookiecutter.module_url }}"
  license: {{ cookiecutter.module_license }}
  # Many licenses require the license statement to be distributed with the package.
  # The filename is relative to the source directory
  license_file: {{ cookiecutter.module_license_file }}
  summary: "{{ cookiecutter.summary }}"
